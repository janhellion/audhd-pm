<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Niki — a task platform for neurodivergent minds">
  <meta name="theme-color" content="#07070d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <title>Niki · task manager</title>
  <link rel="stylesheet" href="/css/style.css?v=7">
  <link rel="stylesheet" href="/css/paper-theme.css?v=1">
  <link rel="stylesheet" href="/css/kanban.css?v=3">
  <link rel="stylesheet" href="/css/auth.css?v=2">
</head>
<body class="paper-bg theme-light">

<div id="app" class="app-layout">
  <!-- Hamburger toggle (mobile only) -->
  <button class="hamburger" id="hamburger" onclick="toggleSidebar()" aria-label="Toggle navigation menu">☰</button>
  <!-- Sidebar backdrop overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span>⌂</span>
      <span class="niki-logo">NIKI <span class="niki-cat">^ↀᴥↀ^</span></span>
    </div>
    <button class="nav-item active" data-view="dashboard" onclick="switchView('dashboard')">
      <span>◉</span> Dashboard
    </button>
    <button class="nav-item" data-view="tasks" onclick="switchView('tasks')">
      <span>☰</span> Tasks
    </button>
    <button class="nav-item" data-view="board" onclick="switchView('board')">
      <span>▤</span> Board
    </button>
    <button class="nav-item" data-view="projects" onclick="switchView('projects')">
      <span>▣</span> Projects
    </button>
    <button class="nav-item" data-view="settings" onclick="switchView('settings')">
      <span>⚙</span> Settings
    </button>

    <div style="margin-top: auto; padding-top: var(--sp-lg); border-top: 1px solid var(--glass-border);">
      <div class="energy-label mb-sm">Energy</div>
      <div class="energy-pills" id="energyPills">
        <span class="energy-pill low" data-level="low" onclick="setEnergy('low')" title="Low energy — rest & simple tasks"></span>
        <span class="energy-pill med active" data-level="medium" onclick="setEnergy('medium')" title="Medium energy — normal flow"></span>
        <span class="energy-pill high" data-level="high" onclick="setEnergy('high')" title="High energy — tackle anything"></span>
      </div>
    </div>
    <div class="user-badge" onclick="switchView('settings')">
      <span>👤</span>
      <span id="userBadge">user</span>
      <button class="logout-btn" onclick="event.stopPropagation();logout()">sign out</button>
    </div>
  </nav>

  <!-- Main area -->
  <main class="main-content">
    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-title">
        <h1 id="viewTitle">Dashboard</h1>
        <p id="viewSubtitle">your current landscape</p>
      </div>
      <div class="topbar-actions" id="topbarActions">
        <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle" title="Toggle dark/light mode">☀️</button>
        <button class="btn btn-orange" onclick="openQuickCapture()">+ New Task</button>
      </div>
    </div>

    <!-- Burnout banner (hidden by default) -->
    <div class="burnout-banner" id="burnoutBanner" style="display:none;">
      <span class="icon">⟁</span>
      <span>Your deferral rate is higher than usual. Safe mode is available.</span>
      <button class="btn btn-ghost" onclick="toggleSafeMode()">Enter Safe Mode</button>
      <button class="btn btn-ghost" onclick="this.closest('.burnout-banner').style.display='none'">✕</button>
    </div>

    <!-- View containers -->
    <div id="view-dashboard" class="view-container"></div>
    <div id="view-tasks" class="view-container" style="display:none;"></div>
    <div id="view-board" class="view-container" style="display:none;"></div>
    <div id="view-projects" class="view-container" style="display:none;"></div>
    <div id="view-settings" class="view-container" style="display:none;"></div>
  </main>
</div>

<!-- Modal container -->
<div id="modalContainer"></div>

<script src="/js/auth.js?v=2"></script>
<script src="/js/app.v5.js?v=2"></script>
</body>
</html>
